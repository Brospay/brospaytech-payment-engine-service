syntax = "proto3";

package payment_engine;

// Core Payment Processing Service
service PaymentEngineService {
  // Payment Intent Operations
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (PaymentIntentResponse);
  rpc ProcessPayment(ProcessPaymentRequest) returns (PaymentResult);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (PaymentStatusResponse);
  rpc CancelPaymentIntent(CancelPaymentIntentRequest) returns (CancelPaymentIntentResponse);
  
  // Transaction Operations (for Merchant Dashboard)
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc SearchTransactions(SearchTransactionsRequest) returns (SearchTransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc GetAllTransactions(GetAllTransactionsRequest) returns (GetAllTransactionsResponse);
  rpc GetTransactionAnalytics(GetTransactionAnalyticsRequest) returns (TransactionAnalyticsResponse);
  rpc ExportTransactions(ExportTransactionsRequest) returns (ExportTransactionsResponse);

  // Transaction Metrics Operations
  rpc GetAverageTransactionValue(GetAverageTransactionValueRequest) returns (GetAverageTransactionValueResponse);
  rpc GetTransactionVolume(GetTransactionVolumeRequest) returns (GetTransactionVolumeResponse);
  rpc GetTransactionSuccessRate(GetTransactionSuccessRateRequest) returns (GetTransactionSuccessRateResponse);
  rpc GetPendingTransactions(GetPendingTransactionsRequest) returns (GetPendingTransactionsResponse);
  rpc GetFailedTransactions(GetFailedTransactionsRequest) returns (GetFailedTransactionsResponse);
  rpc GetTransactionsSummary(GetTransactionsSummaryRequest) returns (GetTransactionsSummaryResponse);
  rpc GetMerchantSummary(GetMerchantSummaryRequest) returns (GetMerchantSummaryResponse);
  
  // Payout Operations
  rpc CreatePayout(CreatePayoutRequest) returns (PayoutResponse);
  rpc CreateManualPayment(CreateManualPaymentRequest) returns (CreateManualPaymentResponse);
  rpc GetPayoutStatus(GetPayoutStatusRequest) returns (PayoutStatusResponse);
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);
  rpc GetPayoutsByCustomer(GetPayoutsByCustomerRequest) returns (ListPayoutsResponse);
  rpc GetAllPayoutTransactions(GetAllPayoutTransactionsRequest) returns (PayoutTransactionsResponse);
  rpc GetPayoutTransactionsSummary(GetPayoutSummaryRequest) returns (PayoutSummaryResponse);
  rpc RetryPayout(RetryPayoutRequest) returns (PayoutResponse);
  rpc GetPayoutMethods(GetPayoutMethodsRequest) returns (PayoutMethodsResponse);
  rpc GetPayoutStats(GetPayoutStatsRequest) returns (PayoutStatsResponse);
  rpc GetPayoutAnalytics(GetPayoutAnalyticsRequest) returns (PayoutAnalyticsResponse);
  
  // Batch Payout Operations
  rpc UploadBatchPayout(UploadBatchPayoutRequest) returns (BatchPayoutResponse);
  rpc ValidateBatchPayout(ValidateBatchPayoutRequest) returns (BatchPayoutValidationResponse);
  rpc ConfirmBatchPayout(ConfirmBatchPayoutRequest) returns (BatchPayoutResponse);
  rpc GetBatchPayoutStatus(GetBatchPayoutStatusRequest) returns (BatchPayoutStatusResponse);
  rpc ListBatchPayouts(ListBatchPayoutsRequest) returns (ListBatchPayoutsResponse);
  rpc GetBatchPayouts(GetBatchPayoutsRequest) returns (GetBatchPayoutsResponse);
  rpc RetryFailedBatchPayouts(RetryFailedBatchPayoutsRequest) returns (BatchPayoutResponse);
  
  // Merchant Settlement Operations
  rpc CreateMerchantSettlement(CreateMerchantSettlementRequest) returns (MerchantSettlementResponse);
  rpc GetSettlementStatus(GetSettlementStatusRequest) returns (SettlementStatusResponse);
  rpc ListSettlements(ListSettlementsRequest) returns (ListSettlementsResponse);
  rpc GetSettlementDetails(GetSettlementDetailsRequest) returns (GetSettlementDetailsResponse);
  rpc CancelSettlement(CancelSettlementRequest) returns (CancelSettlementResponse);
  rpc GetSettlementSummary(GetSettlementSummaryRequest) returns (GetSettlementSummaryResponse);
  rpc GetSettlementLimits(GetSettlementLimitsRequest) returns (GetSettlementLimitsResponse);
  rpc AddBankAccount(AddBankAccountRequest) returns (AddBankAccountResponse);
  rpc VerifyBankAccount(VerifyBankAccountRequest) returns (VerifyBankAccountResponse);
  rpc CancelBatchPayout(CancelBatchPayoutRequest) returns (BatchPayoutResponse);
  
  // Refund Operations
  rpc CreateRefund(CreateRefundRequest) returns (RefundResponse);
  rpc CreateBatchRefund(CreateBatchRefundRequest) returns (CreateBatchRefundResponse);
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse);
  rpc GetRefundStatus(GetRefundStatusRequest) returns (RefundStatusResponse);
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsResponse);
  rpc GetRefundStats(GetRefundStatsRequest) returns (GetRefundStatsResponse);
  rpc CancelRefund(CancelRefundRequest) returns (CancelRefundResponse);
  rpc ApproveRefund(ApproveRefundRequest) returns (ApproveRefundResponse);
  
  // TSP Management Operations (Admin)
  rpc GetTSPConfigurations(GetTSPConfigurationsRequest) returns (TSPConfigurationsResponse);
  rpc CreateTSPConfiguration(CreateTSPConfigRequest) returns (TSPConfigResponse);
  rpc UpdateTSPConfiguration(UpdateTSPConfigRequest) returns (TSPConfigResponse);
  rpc ToggleTSPStatus(ToggleTSPStatusRequest) returns (ToggleTSPStatusResponse);
  rpc ActivateTSPConfiguration(ActivateTSPConfigurationRequest) returns (ActivateTSPConfigurationResponse);
  rpc DeactivateTSPConfiguration(DeactivateTSPConfigurationRequest) returns (DeactivateTSPConfigurationResponse);
  rpc GetTSPHealth(GetTSPHealthRequest) returns (TSPHealthResponse);
  
  // Smart Routing Operations
  rpc GetRoutingDecision(GetRoutingDecisionRequest) returns (RoutingDecisionResponse);
  rpc CreateRoutingOverride(CreateRoutingOverrideRequest) returns (RoutingOverrideResponse);
  rpc GetActiveOverrides(GetActiveOverridesRequest) returns (ActiveOverridesResponse);
  
  // Performance Monitoring
  rpc GetPerformanceMetrics(GetPerformanceMetricsRequest) returns (PerformanceMetricsResponse);
  rpc GetBankPerformance(GetBankPerformanceRequest) returns (BankPerformanceResponse);
  rpc GetSystemHealth(GetSystemHealthRequest) returns (SystemHealthResponse);
}

// Payment Intent Messages
message CreatePaymentIntentRequest {
  int32 merchant_id = 1;
  string customer_id = 2;
  string customer_email = 3;
  string customer_phone = 4;
  double amount = 5;
  string currency = 6;
  string description = 7;
  string payment_method = 8;
  string customer_bank = 9;
  string return_url = 10;
  string webhook_url = 11;
  map<string, string> metadata = 12;
  string request_id = 13;
  string environment = 14;
}

message PaymentIntentResponse {
  bool success = 1;
  string intent_id = 2;
  int32 merchant_id = 3;
  double amount = 4;
  string currency = 5;
  string status = 6;
  string payment_url = 7;
  string qr_code = 8;
  string deep_link = 9;
  string selected_tsp = 10;
  RoutingDecision routing_decision = 11;
  string expires_at = 12;
  int32 estimated_completion_time = 13;
  double processing_fee = 14;
  string created_at = 15;
  map<string, string> metadata = 16;
  string error_message = 17;
}

message RoutingDecision {
  string selected_tsp = 1;
  string reasoning = 2;
  double confidence = 3;
  repeated string alternative_tsps = 4;
  int32 decision_time_ms = 5;
  bool fallback_available = 6;
  map<string, double> decision_factors = 7;
}

message ProcessPaymentRequest {
  string intent_id = 1;
  PaymentMethodDetails payment_method_details = 2;
  CustomerDetails customer_details = 3;
  DeviceInfo device_info = 4;
  string request_id = 5;
}

message PaymentMethodDetails {
  string type = 1;
  string card_number = 2;
  string expiry_month = 3;
  string expiry_year = 4;
  string cvv = 5;
  string card_holder_name = 6;
  string upi_id = 7;
  string bank_code = 8;
  string account_number = 9;
  string ifsc_code = 10;
  string wallet_provider = 11;
  string wallet_phone = 12;
}

message CustomerDetails {
  string name = 1;
  string email = 2;
  string phone = 3;
  Address address = 4;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string postal_code = 5;
}

message DeviceInfo {
  string user_agent = 1;
  string ip_address = 2;
  string device_id = 3;
  string fingerprint = 4;
}

message PaymentResult {
  bool success = 1;
  string intent_id = 2;
  string external_transaction_id = 3;
  string status = 4;
  double amount = 5;
  string currency = 6;
  int32 processing_time_ms = 7;
  string tsp_provider = 8;
  string failure_reason = 9;
  FraudAssessment fraud_assessment = 10;
  string completed_at = 11;
  NextAction next_action = 12;
  string error_message = 13;
}

message FraudAssessment {
  double risk_score = 1;
  repeated string risk_factors = 2;
  string recommendation = 3;
}

message NextAction {
  string action = 1;
  string url = 2;
  int32 poll_interval = 3;
  map<string, string> data = 4;
}

// TSP Management Messages
message GetTSPConfigurationsRequest {
  string environment = 1;
  bool active_only = 2;
  string request_id = 3;
}

message TSPConfigurationsResponse {
  bool success = 1;
  repeated TSPConfigData configurations = 2;
  string error_message = 3;
}

message TSPConfigResponse {
  bool success = 1;
  string message = 2;
  TSPConfigData data = 3;
  string error_message = 4;
}

message TSPConfigData {
  int32 config_id = 1;
  string provider_name = 2;
  string display_name = 3;
  string environment = 4;
  bool is_active = 5;
  int32 priority = 6;
  string health_status = 7;
  string last_health_check = 8;
  map<string, string> configuration = 9;
  repeated string supported_currencies = 10;
  repeated string supported_payment_methods = 11;
  string webhook_url = 12;
  int32 connection_timeout = 13;
  int32 read_timeout = 14;
  string created_at = 15;
  string updated_at = 16;
  string created_by = 17;
  string updated_by = 18;
}

message SupportedFeatures {
  bool instant_payouts = 1;
  bool refunds = 2;
  bool recurring_payments = 3;
  bool webhooks = 4;
}

message PerformanceMetrics {
  double success_rate = 1;
  int32 average_latency = 2;
  int32 total_transactions = 3;
  string last_updated = 4;
}

// Performance Monitoring Messages
message GetPerformanceMetricsRequest {
  string time_range_start = 1;
  string time_range_end = 2;
  string measurement_window = 3;
  string tsp_provider = 4;
  string environment = 5;
  string request_id = 6;
}

message PerformanceMetricsResponse {
  bool success = 1;
  repeated TSPPerformanceData tsp_performance = 2;
  SystemPerformanceData system_performance = 3;
  string error_message = 4;
}

message TSPPerformanceData {
  string provider_name = 1;
  string environment = 2;
  double success_rate = 3;
  int32 average_latency = 4;
  int32 total_transactions = 5;
  string measurement_window = 6;
  string timestamp = 7;
}

message SystemPerformanceData {
  int32 total_requests = 1;
  double average_response_time = 2;
  double throughput_per_second = 3;
  double error_rate = 4;
  double cpu_utilization = 5;
  double memory_utilization = 6;
  double cache_hit_rate = 7;
}

